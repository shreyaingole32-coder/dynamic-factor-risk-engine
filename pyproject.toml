[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-factor-risk-engine"
version = "0.1.0"
description = "Dynamic Multi-Factor Portfolio & Tail-Risk Research Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "streamlit>=1.25.0",
    "plotly>=5.15.0",
    "matplotlib>=3.7.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
